<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2a63">
<meta name="robots" content="noindex,nofollow">
<title>Mis medios</title>
<link rel="icon" href="icono.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<style>
.login{max-width:400px;margin:12vh auto 0;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login .title{justify-content:center;font-size:1.3rem;margin-bottom:4px}
.login p{margin:0;text-align:center;color:var(--mut);font-size:.9rem}
.login button{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px}
.login button svg{width:20px;height:20px}
.err{color:#ff9aa2;text-align:center;font-size:.88rem;min-height:1.2em}
a.out{margin-left:auto;font-size:.82rem;font-weight:500;color:var(--acc2);text-decoration:none;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);cursor:pointer}
li{display:flex;gap:8px;align-items:stretch}
li a.item{flex:1;min-width:0}
a.dl{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:18px;text-decoration:none;color:var(--tx);font-size:.88rem;font-weight:600;background:linear-gradient(135deg,rgba(78,161,255,.28),rgba(37,99,235,.28));border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.15s}
a.dl:hover{background:linear-gradient(135deg,rgba(78,161,255,.45),rgba(37,99,235,.45));border-color:rgba(124,196,255,.6)}
a.dl svg{width:20px;height:20px;fill:none;stroke:var(--acc2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.queue{margin:14px 0 0;padding:12px 16px;font-size:.85rem;color:var(--mut)}
.queue b{color:var(--tx);font-weight:600}.queue div{padding:4px 0;word-break:break-all}.queue .e{color:#ff9aa2}
.hidden{display:none!important}
@media(max-width:560px){a.dl span{display:none}a.dl{padding:0 13px}li a.item{gap:10px;padding:10px 12px}.ic{width:38px;height:38px}}
</style>
</head>
<body>
<div class="wrap">

  <form class="glass login hidden" id="vLogin" onsubmit="return false">
    <div class="title"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg></i>Mis medios</div>
    <p>Inicia sesión con tu cuenta de Google para ver tus archivos</p>
    <button id="bLogin" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M20.5 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.6-3.9 2.6-6.6z"/><path d="M12 21c2.4 0 4.5-.8 5.9-2.2l-2.9-2.2c-.8.5-1.8.9-3 .9a5.2 5.2 0 0 1-4.9-3.6H4.1v2.3A9 9 0 0 0 12 21z"/><path d="M7.1 13.9a5.4 5.4 0 0 1 0-3.4V8.2h-3a9 9 0 0 0 0 8z"/><path d="M12 6.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 4.1 8.2l3 2.3A5.2 5.2 0 0 1 12 6.6z"/></svg>Entrar con Google</button>
    <div class="err" id="eLogin"></div>
  </form>

  <div id="vApp" class="hidden">
    <header class="glass">
      <div class="title"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg></i>Mis medios<a class="out" id="bOut">Cerrar sesión</a></div>
      <div class="crumbs" id="crumbs"></div>
      <div class="row"><input class="t" id="q" placeholder="Buscar en esta carpeta" autocomplete="off"></div>
      <div class="row"><input class="t" id="lk" placeholder="Pegar enlace de un video, audio o imagen para descargar" autocomplete="off" inputmode="url"><button id="go">Descargar</button></div>
      <div id="msg"></div>
    </header>
    <div class="glass queue hidden" id="queue"></div>
    <ul id="list"></ul>
  </div>
</div>

<div id="pl"><div class="box glass"><button id="x">Cerrar</button><h2 id="pt"></h2><div id="pb"></div></div></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js"></script>
</body>
</html>
