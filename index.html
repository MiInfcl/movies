<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b2a63">
<meta name="robots" content="noindex,nofollow">
<title>Mis medios</title>
<link rel="icon" href="icono.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<style>
.login{max-width:400px;margin:10vh auto 0;padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.login .title{justify-content:center;font-size:1.3rem;margin-bottom:4px}
.login p{margin:0;text-align:center;color:var(--mut);font-size:.9rem}
.login label{font-size:.82rem;color:var(--mut);margin:0 4px -6px}
.login button{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px}
.login button svg{width:20px;height:20px}
.login .gbtn{background:var(--glass2);box-shadow:none;border:1px solid var(--line)}
.sep{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.8rem}.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.lerr{color:#ff9aa2;text-align:center;font-size:.88rem;min-height:1.2em}
.title{flex-wrap:wrap}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:500;color:var(--mut)}
.who b{color:var(--tx);font-weight:600}.who .rol{padding:2px 8px;border-radius:999px;background:rgba(78,161,255,.22);color:var(--acc2);font-size:.72rem}
a.out,button.ghost{font-size:.82rem;font-weight:500;color:var(--acc2);text-decoration:none;padding:7px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);box-shadow:none;cursor:pointer}
button.ghost{display:inline-flex;align-items:center;gap:6px}button.ghost svg{width:16px;height:16px;fill:none;stroke:var(--acc2);stroke-width:2;stroke-linecap:round}
.row{flex-wrap:wrap}
button.danger{background:linear-gradient(135deg,#ff6b7d,#c2334a);box-shadow:0 6px 18px rgba(194,51,74,.35)}
#msg:empty{display:none}.ok{color:#7dffb0!important}.err{color:#ff9aa2!important}
li{display:flex;gap:8px;align-items:stretch}
li a.item{flex:1;min-width:0}
a.dl,button.more{flex:none;display:flex;align-items:center;gap:8px;padding:0 16px;border-radius:18px;text-decoration:none;color:var(--tx);font-size:.88rem;font-weight:600;background:linear-gradient(135deg,rgba(78,161,255,.28),rgba(37,99,235,.28));border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.15s;box-shadow:none}
button.more{padding:0 13px;background:var(--glass)}
a.dl:hover,button.more:hover{background:linear-gradient(135deg,rgba(78,161,255,.45),rgba(37,99,235,.45));border-color:rgba(124,196,255,.6)}
a.dl svg{width:20px;height:20px;fill:none;stroke:var(--acc2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.more svg{width:20px;height:20px;fill:var(--acc2)}
.queue{margin:14px 0 0;padding:12px 16px;font-size:.85rem;color:var(--mut)}
.queue b{color:var(--tx);font-weight:600}.queue div{padding:4px 0;word-break:break-all}.queue .e{color:#ff9aa2}
.aviso{margin:14px 0 0;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.aviso span{flex:1;min-width:200px}
.hidden{display:none!important}
#menu{position:fixed;z-index:40;min-width:190px;padding:6px;display:none;flex-direction:column;background:rgba(12,30,70,.92);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,10,40,.5)}
#menu.on{display:flex}#menu button{background:none;box-shadow:none;text-align:left;padding:10px 12px;border-radius:11px;font-weight:500;font-size:.92rem}
#menu button:hover{background:rgba(78,161,255,.22)}#menu button.bad{color:#ff9aa2}
#dlg{position:fixed;inset:0;z-index:45;display:none;place-items:center;padding:16px;background:rgba(2,8,24,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#dlg.on{display:grid}#dlg .box{width:min(460px,100%);max-height:86vh;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
#dlg h3{margin:0;font-size:1.05rem}#dlg p{margin:0;color:var(--mut);font-size:.9rem;word-break:break-word}
#dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}#dlg .acts .ghost{padding:10px 16px}
#dlg .pick{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
#dlg .pick button{text-align:left;background:var(--glass);box-shadow:none;border:1px solid var(--line);font-weight:500;padding:9px 12px}
#dlg .pick button.on{background:linear-gradient(135deg,var(--acc),#2563eb);border-color:transparent}
#dlg table{width:100%;border-collapse:collapse;font-size:.9rem}#dlg td{padding:7px 4px;border-bottom:1px solid var(--line)}
#dlg td:last-child{text-align:right}#dlg td button{padding:5px 10px;font-size:.8rem}
#dlg select{background:rgba(0,10,40,.35);border:1px solid var(--line);border-radius:14px;color:var(--tx);padding:10px 12px;font:inherit}
@media(max-width:560px){a.dl span{display:none}a.dl{padding:0 13px}li a.item{gap:10px;padding:10px 12px}.ic{width:38px;height:38px}}
</style>
</head>
<body>
<div class="wrap">

  <form class="glass login hidden" id="vLogin">
    <div class="title"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg></i>Mis medios</div>
    <p>Inicia sesión para ver los archivos</p>
    <label for="u">Usuario</label><input class="t" id="u" autocomplete="username" autocapitalize="none" required>
    <label for="p">Contraseña</label><input class="t" id="p" type="password" autocomplete="current-password" required>
    <button type="submit" id="bEntrar">Entrar</button>
    <div class="sep">o</div>
    <button id="bLogin" type="button" class="gbtn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M20.5 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.6-3.9 2.6-6.6z"/><path d="M12 21c2.4 0 4.5-.8 5.9-2.2l-2.9-2.2c-.8.5-1.8.9-3 .9a5.2 5.2 0 0 1-4.9-3.6H4.1v2.3A9 9 0 0 0 12 21z"/><path d="M7.1 13.9a5.4 5.4 0 0 1 0-3.4V8.2h-3a9 9 0 0 0 0 8z"/><path d="M12 6.6c1.3 0 2.5.5 3.4 1.3l2.6-2.6A9 9 0 0 0 4.1 8.2l3 2.3A5.2 5.2 0 0 1 12 6.6z"/></svg>Entrar con Google</button>
    <div class="lerr" id="eLogin"></div>
  </form>

  <div id="vApp" class="hidden">
    <header class="glass">
      <div class="title"><i><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg></i>Mis medios<span class="who" id="who"></span></div>
      <div class="crumbs" id="crumbs"></div>
      <div class="row"><input class="t" id="q" placeholder="Buscar en esta carpeta" autocomplete="off"><span id="adminBtns" class="hidden" style="display:flex;gap:8px"><button class="ghost" id="nueva" type="button"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Carpeta</button><button class="ghost" id="usuarios" type="button"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.2A4.5 4.5 0 0 1 21 18.5"/></svg>Usuarios</button></span></div>
      <div class="row"><input class="t" id="lk" placeholder="Pegar enlace de un video, audio o imagen para descargar" autocomplete="off" inputmode="url"><button id="go">Descargar</button></div>
      <div id="msg"></div>
    </header>
    <div class="glass aviso hidden" id="aviso"></div>
    <div class="glass queue hidden" id="queue"></div>
    <ul id="list"></ul>
  </div>
</div>
<div id="menu"></div><div id="dlg"><div class="box glass"></div></div>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="reproductor.js"></script>
<script src="app.js"></script>
</body>
</html>
