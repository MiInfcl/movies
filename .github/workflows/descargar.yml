# Procesa los pedidos de descarga que deja la web en la carpeta _pedidos de Google Drive:
# baja cada enlace directo a Drive (rclone copyurl, sin pasar por ningún PC) y borra el pedido.
name: Descargar enlaces a Drive
on:
  schedule:
    - cron: '*/5 * * * *'     # GitHub lo corre cada 5 a 15 minutos
  workflow_dispatch:
concurrency:
  group: descargar
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Instalar rclone
        run: |
          curl -fsSL https://downloads.rclone.org/v1.68.2/rclone-v1.68.2-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip && sudo install rclone-*/rclone /usr/local/bin/ && rm -rf rclone*
      - name: Configurar Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Procesar pedidos
        env:
          ROOT_ID: ${{ vars.ROOT_ID }}
          QUEUE_NAME: ${{ vars.QUEUE_NAME || '_pedidos' }}
        run: bash scripts/procesar-pedidos.sh
